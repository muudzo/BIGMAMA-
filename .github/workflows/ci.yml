name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (skip if no tsconfig)
        run: |
          if [ -f tsconfig.json ]; then
            echo "tsconfig.json found — running typecheck"
            npx tsc --noEmit
          else
            echo "No tsconfig.json — skipping typecheck gracefully"
          fi

      - name: Unit tests
        run: npm run test -- --run

      - name: Chaos tests
        run: npm run test:chaos -- --run

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        if: matrix.node == '20'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Bundle size check (gzip total <= 300KB)
        if: matrix.node == '20'
        run: |
          set -euo pipefail
          MAX_BYTES=$((300 * 1024))
          if [ ! -d dist ]; then
            echo "dist/ not found"
            exit 1
          fi
          TOTAL=0
          while IFS= read -r -d '' f; do
            SIZE=$(gzip -c "$f" | wc -c | tr -d ' ')
            TOTAL=$((TOTAL + SIZE))
            printf '  %8d bytes gz  %s\n' "$SIZE" "$f"
          done < <(find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.svg' -o -name '*.json' \) -print0)
          echo "Total gzip size: ${TOTAL} bytes (limit ${MAX_BYTES})"
          if [ "$TOTAL" -gt "$MAX_BYTES" ]; then
            echo "::error::Bundle gzip size ${TOTAL} exceeds limit ${MAX_BYTES}"
            exit 1
          fi
